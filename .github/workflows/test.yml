name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgomp1
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Check shell and Python
        run: |
          bash -n stitch.sh
          ruff check src tests
      - name: Test without desktop windows
        run: python -m unittest discover -s tests -t . -v
      - name: Verify entry points and package build
        run: |
          gs-merger --version
          python -m gs_merger --help
          python examples/verify_sim3.py
          python -m pip wheel . --no-deps --wheel-dir dist
